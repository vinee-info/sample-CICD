apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-sample-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-sample-app
  template:
    metadata:
      labels:
        app: nodejs-sample-app
    spec:
      containers:
        - name: nodejs-container
          image: vinee0311/kubernetes-sample-app:v1
          ports:
            - containerPort: 3000